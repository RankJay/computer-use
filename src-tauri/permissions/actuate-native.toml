# Least-privilege allowlist for application #[tauri::command] handlers (S3).
# Each block documents why IPC exposure exists; pair with src/agent/tauriIpc.ts on the frontend.

[[permission]]
identifier = "allow-capture-primary-display"
description = """
Enables capture_primary_display_png_base64: hides the main window briefly (with DWM-friendly waits),
samples the primary display into PNG (base64) with the mouse cursor drawn on top (Windows), then restores the window. Captures are serialized so
overlapping calls cannot race hide/show. On macOS the OS may require Screen Recording permission.
"""
commands.allow = ["capture_primary_display_png_base64"]

[[permission]]
identifier = "allow-run-command"
description = """
Enables run_command: spawns a subprocess with the given program, argv, and optional cwd.
High impact — arbitrary local execution. User consent must precede invocation via the permission model.
"""
commands.allow = ["run_command"]

[[permission]]
identifier = "allow-pointer-move-to"
description = """
Enables pointer_move_to: moves the OS mouse to the center of a 1-based grid square on the latest capture (16px squares, DPI-safe logical mapping).
"""
commands.allow = ["pointer_move_to"]

[[permission]]
identifier = "allow-pointer-click"
description = """
Enables pointer_click: synthesizes a mouse button click at the current cursor position (UI automation).
"""
commands.allow = ["pointer_click"]

[[permission]]
identifier = "allow-type-text"
description = """
Enables type_text: synthesizes keyboard input to the focused application (UI automation).
"""
commands.allow = ["type_text"]

[[permission]]
identifier = "allow-key-tap"
description = """
Enables key_tap: synthesizes a single key press (enter, tab, escape, backspace) to the focused application (UI automation).
"""
commands.allow = ["key_tap"]

[[permission]]
identifier = "allow-pointer-automation-lifecycle"
description = """
Allows reset_pointer_automation_cancel when starting a task and cancel_pointer_automation (Esc UI) to abort in-flight moves/clicks from the frontend.
"""
commands.allow = ["reset_pointer_automation_cancel", "cancel_pointer_automation"]
